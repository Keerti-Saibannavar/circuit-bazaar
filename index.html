<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circuit Bazaar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
 
<style>
  :root{
    --bg: #fffffffc;
    --panel: #fefefe;
    --trace: #2ce551;
    --copper: #f82f07;
    --silk: #1e4c35;
    --muted: #0c0d0d;
  }
 
  body{
    margin:0;
    background:var(--bg);
    color:var(--silk);
    font-family:'IBM Plex Sans', sans-serif;
  }
 
  header{
    padding:20px;
  }
 
  h1{
    font-family:'JetBrains Mono', monospace;
    color:var(--copper);
    margin:0 0 10px;
  }
 
  #searchInput{
    padding:15px;
    width:350px;
    border-radius:10px;
    border:1px solid #060807;
    background:var(--panel);
    color:var(--muted);
  }
 
  #categoryRail{
    margin-top:20px;
  }
 
  .chip-btn{
    padding:10px 14px;
    border-radius:999px;
    border:1px solid #100c0c;
    background:var(--panel);
    color:var(--muted);
    cursor:pointer;
    margin-right:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.8rem;
  }
 
  .chip-btn.active{
    background:var(--trace);
    color:#06251a;
    font-weight:700;
  }
 
  main{
    padding:20px;
  }
 
  #productGrid{
    display:grid;
    gap:16px;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
  }
 
  .card{
    background:var(--panel);
    border:1px solid #1a1d1c;
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
 
  .card img{
    width:100%;
    height:250px;
    object-fit:cover;
    display:block;
    background:#08201a;
  }
 
  .card-body{
    padding:16px;
    display:flex;
    flex-direction:column;
    flex:1;
  }
 
  .card h3{
    margin:0 0 8px;
    font-size:1.25rem;
  }
 
  .card .spec{
    font-family:'JetBrains Mono', monospace;
    font-size:0.90em;
    font-weight:500;
    color:var(--muted);
    margin:0 0 10px;
  }
 
  .card .price{
    font-family:'JetBrains Mono', monospace;
    color:var(--copper);
    font-weight:1000;
    margin:0 0 10px;
  }
 
  .btn-cart{
    display:block;
    text-align:center;
    background:var(--trace);
    color:#06251a;
    padding:10px;
    border-radius:6px;
    font-weight:700;
    text-decoration:none;
    margin-top:auto;
  }
</style>
</head>
 
<body>

    <div id="categoryRail">

  const AMAZON_ASSOCIATE_TAG = ""; // put your tag here later, e.g. "yourtag-21"
 
  function amazonUrl(query){
    let url = "https://www.amazon.in/s?k=" + encodeURIComponent(query);
    if (AMAZON_ASSOCIATE_TAG) url += "&tag=" + AMAZON_ASSOCIATE_TAG;
    return url;
  }
 
  let activeCat = "all";
  const grid = document.getElementById("productGrid");
 
  function renderProducts(){
    const query = document.getElementById("searchInput").value.trim().toLowerCase();
 
    const filtered = products.filter(p =>
      (activeCat === "all" || p.cat === activeCat) &&
      (p.name.toLowerCase().includes(query) || p.spec.toLowerCase().includes(query))
    );
 
    grid.innerHTML = filtered.map(p => `
      <div class="card">
        <img src="${p.img}" alt="${p.name}">
        <div class="card-body">
          <h3>${p.name}</h3>
          <p class="spec">${p.spec}</p>
          <p class="price">${p.price}</p>
          <a class="btn-cart" href="${amazonUrl(p.q)}" target="_blank">Add to Cart</a>
        </div>
      </div>
    `).join("");
  }
 
  document.querySelectorAll(".chip-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".chip-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeCat = btn.dataset.cat;
      renderProducts();
    });
  });
 
  document.getElementById("searchInput").addEventListener("input", renderProducts);
 
  renderProducts();
